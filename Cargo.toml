[package]
name = "pipecap"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Inspect Apple Silicon display-pipe allocation and cap a monitor's EDID so more external displays fit"
authors = ["a1678991 <a1678991@iroserver.net>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/a1678991/pipecap"
keywords = ["macos", "edid", "display", "apple-silicon", "monitor"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
