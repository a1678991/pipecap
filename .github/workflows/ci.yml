name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features
      - name: test
        run: cargo test --all-features
      - name: build (release)
        run: cargo build --release --locked
      - name: smoke test the binary
        run: |
          ./target/release/pipecap --version
          ./target/release/pipecap decode tests/fixtures/mon_4k160_dp.bin
          ./target/release/pipecap --json decode tests/fixtures/mon_4k240_hdmi.bin | head -c 400
      - uses: actions/upload-artifact@v4
        with:
          name: pipecap-${{ github.sha }}-macos-arm64
          path: target/release/pipecap
